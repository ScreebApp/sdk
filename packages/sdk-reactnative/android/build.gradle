apply plugin: "com.android.library"

// AGP 9 compiles Kotlin itself unless the app opts out with android.builtInKotlin=false;
// applying the Kotlin plugin on top of built-in Kotlin fails the build.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
if (agpMajor < 9 || providers.gradleProperty('android.builtInKotlin').getOrElse('true') == 'false') {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ScreebReactNative_" + name]).toInteger()
}

android {
  namespace = "app.screeb.reactnative"

  compileSdk = getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdk = getExtOrIntegerDefault("minSdkVersion")
  }

  buildFeatures {
    buildConfig = true
  }

  buildTypes {
    release {
      minifyEnabled = false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
  compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}

dependencies {
  implementation "com.facebook.react:react-android"
  api "app.screeb.sdk:survey:4.5.0"
}
