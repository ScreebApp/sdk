group = 'app.screeb.plugin_screeb'
version = '5.0.0'

apply plugin: 'com.android.library'

// AGP 9 compiles Kotlin itself unless the app opts out with android.builtInKotlin=false;
// applying the Kotlin plugin on top of built-in Kotlin fails the build.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
if (agpMajor < 9 || providers.gradleProperty('android.builtInKotlin').getOrElse('true') == 'false') {
    apply plugin: 'kotlin-android'
}

android {
    namespace = 'app.screeb.plugin_screeb'
    compileSdk = 35

    defaultConfig {
        minSdk = 21
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
}

dependencies {
    api "app.screeb.sdk:survey:5.0.0"
}
