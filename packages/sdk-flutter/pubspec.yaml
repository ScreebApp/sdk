name: plugin_screeb
description: Continuous Product Discovery
version: 4.2.0
homepage: https://screeb.app
repository: https://github.com/ScreebApp/sdk

# Semantics(identifier:) needs Flutter 3.19 / Dart 3.3: older toolchains must
# resolve an earlier package version instead of failing to compile this one.
environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
flutter:
  plugin:
    platforms:
      android:
        package: app.screeb.plugin_screeb
        pluginClass: PluginScreebPlugin
      ios:
        pluginClass: PluginScreebPlugin
