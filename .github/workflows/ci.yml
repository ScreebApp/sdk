name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  js:
    name: JS/TS packages
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      NX_DAEMON: false
      NX_NO_CLOUD: true
      NX_DISABLE_DB: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm test

  flutter:
    name: Flutter package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - run: cd packages/sdk-flutter && flutter pub get
      - run: cd packages/sdk-flutter && flutter analyze
