name: Publish Screeb.Maui

on:
  push:
    tags:
      - 'sdk-maui/v*'

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install android ios

      - name: Restore
        run: dotnet restore packages/sdk-maui/ScreebMaui.csproj

      - name: Build Android
        run: dotnet build packages/sdk-maui/ScreebMaui.csproj -f net8.0-android -c Release --no-restore

      - name: Build iOS
        run: dotnet build packages/sdk-maui/ScreebMaui.csproj -f net8.0-ios -c Release --no-restore

      - name: Pack
        run: dotnet pack packages/sdk-maui/ScreebMaui.csproj -c Release --no-build -o ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
